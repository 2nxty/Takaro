name: Check

# Compiles and tests Takaro on Windows, macOS and Linux on every push and pull request — no
# installers, no release. Catches code that only breaks on one system (the Windows-only machine
# used for development can't build the other two) minutes after the push, before anyone installs it.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-22.04 }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The page scripts are plain JavaScript: a syntax error would only show up in the app.
      - name: Page scripts (syntax)
        shell: bash
        run: |
          for f in src-tauri/src/inject/*.js src-tauri/src/inject/plugins/*.js docs/*.js docs/i18n/*.js; do
            node --check "$f" || exit 1
          done

      - name: Build (debug)
        working-directory: src-tauri
        run: cargo build --locked

      - name: Tests
        working-directory: src-tauri
        run: cargo test --locked
