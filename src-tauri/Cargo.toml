[package]
name = "takaro"
version = "0.4.1"
edition = "2021"
description = "Lightweight YouTube Music desktop player with Discord Rich Presence"
license = "MIT"
repository = "https://github.com/2nxty/Takaro"
homepage = "https://takaro.im"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-single-instance = "2"
md5 = "0.8" # Last.fm API signatures

# HTTP downloads on macOS / Linux (ad blocker lists, update check): curl isn't always installed
# there (Ubuntu doesn't ship it). Windows uses its built-in curl.exe.
[target.'cfg(not(windows))'.dependencies]
ureq = "3"

[dev-dependencies]
ureq = "3" # tests the macOS / Linux download path on Windows too

[target.'cfg(windows)'.dependencies]
# Same versions Tauri uses; needed for the WebView2 extensions API.
webview2-com = "0.39"
windows-core = "0.62"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
